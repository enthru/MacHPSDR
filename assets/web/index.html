<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MacHPSDR Remote</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">MAC HPSDR</p>
      <h1>Browser Remote</h1>
    </div>
    <div id="connection" class="connection offline" role="status">Connecting…</div>
  </header>

  <main>
    <button id="enable-sound" class="enable-sound" type="button" hidden>🔈 Tap to enable sound</button>
    <section id="empty" class="empty" hidden>No visible receiver is available.</section>
    <section id="receivers" class="receivers" aria-live="polite"></section>
  </main>

  <template id="receiver-template">
    <article class="receiver-card">
      <div class="receiver-heading">
        <span class="rx-name">RX</span>
        <span class="meter-text">−200.0 dB</span>
      </div>
      <div class="meter" aria-label="Signal level"><span></span></div>
      <div class="spectrum-toolbar">
        <label>
          Spectrum
          <select class="spectrum-profile">
            <option>Low</option>
            <option selected>Balanced</option>
            <option>High</option>
          </select>
        </label>
        <button class="audio-toggle" type="button" hidden aria-pressed="false">Mute</button>
        <span class="spectrum-status">Waiting for spectrum</span>
      </div>
      <audio class="rx-audio" hidden></audio>
      <canvas class="spectrum" height="300" tabindex="0"
              aria-label="Live panadapter and waterfall. Click or drag to tune, use the wheel to step, or drag a filter edge."></canvas>
      <label class="frequency-label">
        Frequency, Hz
        <input class="frequency" inputmode="numeric" autocomplete="off">
      </label>
      <div class="control-row">
        <button class="apply-frequency" type="button">Tune</button>
        <label>
          Mode
          <select class="mode"></select>
        </label>
      </div>
      <div class="control-grid">
        <label>
          Step, Hz
          <select class="step">
            <option value="1">1</option>
            <option value="10">10</option>
            <option value="100">100</option>
            <option value="1000">1 k</option>
            <option value="5000">5 k</option>
            <option value="9000">9 k</option>
            <option value="10000">10 k</option>
            <option value="100000">100 k</option>
            <option value="1000000">1 M</option>
          </select>
        </label>
        <label>
          AGC
          <select class="agc">
            <option value="0">Off</option>
            <option value="1">Long</option>
            <option value="2">Slow</option>
            <option value="3">Medium</option>
            <option value="4">Fast</option>
          </select>
        </label>
        <label>
          AF gain <span class="af-gain-val"></span>
          <input class="af-gain" type="range" min="0" max="100" step="1">
        </label>
        <label>
          Squelch <span class="squelch-val"></span>
          <input class="squelch" type="range" min="0" max="100" step="1">
        </label>
        <label>
          AGC gain, dB <span class="agc-gain-val"></span>
          <input class="agc-gain" type="range" min="-20" max="120" step="1">
        </label>
      </div>
      <p class="lock-state"></p>
    </article>
  </template>

  <footer>
    <button id="mox" class="mox" type="button" disabled>MOX</button>
    <span id="revision">Waiting for radio state</span>
  </footer>
  <script src="/app.js" defer></script>
</body>
</html>
