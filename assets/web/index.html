<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MacHPSDR Remote</title>
  <meta name="theme-color" content="#152430">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MacHPSDR">
  <!-- use-credentials: a manifest is fetched without them by default, so behind
       the remote's password it would 401 and the page would not install. -->
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="titlebar">
    <span class="app-name">MacHPSDR <span class="app-sub">Browser Remote</span></span>
    <div class="titlebar-right">
      <button id="control" class="control-btn" type="button" hidden>Take control</button>
      <div id="connection" class="connection offline" role="status">Connecting…</div>
    </div>
  </header>

  <main>
    <button id="enable-sound" class="enable-sound" type="button" hidden>🔈 Tap to enable sound</button>
    <section id="empty" class="empty" hidden>No visible receiver is available.</section>
    <section id="receivers" class="receivers" aria-label="Receivers"></section>
  </main>

  <template id="receiver-template">
    <article class="rx">
      <!-- VFO bar: navigation chips, big frequency readouts, gain sliders, S-meter -->
      <div class="vfo-bar">
        <div class="vfo-nav">
          <span class="rx-name chip chip-static">RX</span>
          <label class="chip chip-select-wrap" title="Band (refused while the VFO is locked)">
            <span class="chip-select-prefix">BAND</span>
            <select class="band-sel chip-select" aria-label="Band"></select>
          </label>
          <button class="chip dead" type="button" disabled title="Not yet available in the browser remote">A&gt;B</button>
          <button class="chip dead" type="button" disabled title="Not yet available in the browser remote">A&lt;B</button>
          <button class="chip dead" type="button" disabled title="Not yet available in the browser remote">A&lt;&gt;B</button>
          <button class="chip split-chip" type="button" title="Split (VFO A/B)">SPLIT</button>
          <span class="chip chip-zoom chip-static" title="Zoom follows the desktop radio">ZOOM&nbsp;x1</span>
          <label class="chip chip-select-wrap" title="Tuning step">
            <span class="chip-select-prefix">STEP</span>
            <select class="step chip-select">
              <option value="1">1 Hz</option>
              <option value="10">10 Hz</option>
              <option value="25">25 Hz</option>
              <option value="50">50 Hz</option>
              <option value="100">100 Hz</option>
              <option value="250">250 Hz</option>
              <option value="500">500 Hz</option>
              <option value="1000">1 kHz</option>
              <option value="5000">5 kHz</option>
              <option value="9000">9 kHz</option>
              <option value="10000">10 kHz</option>
              <option value="12500">12.5 kHz</option>
              <option value="100000">100 kHz</option>
              <option value="250000">250 kHz</option>
              <option value="500000">500 kHz</option>
              <option value="1000000">1 MHz</option>
            </select>
          </label>
        </div>

        <div class="vfo-freqs">
          <div class="vfo-a">
            <span class="vfo-tag">VFO A</span>
            <span class="freq freq-a" role="button" tabindex="0" title="Click to enter a frequency; wheel over a digit tunes by that digit; hover a digit and type 0-9 to overwrite it"></span>
            <input class="freq-edit" inputmode="numeric" autocomplete="off" aria-label="VFO A frequency in hertz" hidden>
          </div>
          <div class="vfo-b">
            <span class="vfo-tag">VFO B</span>
            <span class="freq freq-b" title="VFO B is not yet exposed by the remote protocol">—</span>
          </div>
        </div>

        <div class="vfo-right">
          <div class="vfo-aux">
            <label class="gain gain-af" title="AF gain">
              <span class="gain-tag">AF<b class="af-gain-val"></b></span>
              <input class="af-gain" type="range" min="0" max="100" step="1">
            </label>
            <button class="chip mute audio-toggle" type="button" hidden aria-pressed="false" title="Mute received audio" aria-label="Mute received audio">🔈</button>
            <button class="chip rec rec-toggle" type="button" hidden aria-pressed="false" title="Record received audio to a file on this device" aria-label="Record received audio to a file on this device">⏺</button>
            <label class="gain gain-agc" title="AGC gain">
              <span class="gain-tag">AGC<b class="agc-gain-val"></b></span>
              <input class="agc-gain" type="range" min="-20" max="120" step="1">
            </label>
            <label class="gain gain-rf" title="Receiver RF front-end gain or attenuation">
              <span class="gain-tag"><span class="rf-label">RF</span><b class="rf-gain-val"></b></span>
              <input class="rf-gain" type="range" min="0" max="31" step="1">
            </label>
          </div>

          <div class="smeter" title="Signal meter">
            <div class="smeter-scale"><i>S1</i><i>3</i><i>5</i><i>7</i><i>9</i><i>+20</i><i>+40</i><i>+60</i></div>
            <div class="smeter-bar"><span></span></div>
            <div class="smeter-read">—</div>
          </div>
        </div>
      </div>

      <!-- Mode/status strip -->
      <div class="mode-bar">
        <button class="chip lock-chip dead" type="button" disabled title="VFO lock is set on the desktop radio">LOCK</button>
        <label class="chip chip-select-wrap chip-on" title="Demodulation mode">
          <select class="mode chip-select" aria-label="Mode"></select>
        </label>
        <label class="chip chip-select-wrap chip-on filter-wrap" title="Filter width preset (or drag the panadapter edges)">
          <select class="filter-sel chip-select" aria-label="Filter width"></select>
        </label>
        <label class="chip chip-select-wrap nb-wrap" title="Noise blanker">
          <span class="chip-select-prefix">NB</span>
          <select class="nb-sel chip-select">
            <option value="0">OFF</option>
            <option value="1">NB</option>
            <option value="2">NB2</option>
          </select>
        </label>
        <label class="chip chip-select-wrap nr-wrap" title="Noise reduction">
          <span class="chip-select-prefix">NR</span>
          <select class="nr-sel chip-select">
            <option value="0">OFF</option>
            <option value="1">NR</option>
            <option value="2">NR2</option>
            <option value="3">NR3</option>
            <option value="4">NR4</option>
          </select>
        </label>
        <button class="chip snb-chip" type="button" title="Spectral noise blanker">SNB</button>
        <button class="chip anf-chip" type="button" title="Automatic notch filter">ANF</button>
        <label class="chip chip-select-wrap chip-on" title="AGC time constant">
          <span class="chip-select-prefix">AGC</span>
          <select class="agc chip-select">
            <option value="0">OFF</option>
            <option value="1">LONG</option>
            <option value="2">SLOW</option>
            <option value="3">MED</option>
            <option value="4">FAST</option>
          </select>
        </label>
        <button class="chip rit-chip" type="button" title="RIT — click to toggle, wheel or up/down arrows to adjust">RIT</button>
        <button class="chip xit-chip" type="button" title="XIT — click to toggle, wheel or up/down arrows to adjust">XIT</button>
        <button class="chip dead" type="button" disabled title="Click-tune — not yet available in the browser remote">CTUN</button>
        <button class="chip dead" type="button" disabled title="Duplex — not yet available in the browser remote">DUP</button>
        <button class="chip subrx-chip" type="button" title="Enable the sub-receiver on VFO B">SUB RX</button>
        <label class="chip chip-sql subrx-mix-wrap" title="Sub-RX crossfeed: split to mono">
          <span class="chip-select-prefix">MIX<b class="subrx-mix-val"></b></span>
          <input class="subrx-mix" type="range" min="0" max="100" step="1">
        </label>
        <label class="chip chip-select-wrap bookmark-wrap" title="Recall a saved desktop bookmark">
          <span class="chip-select-prefix">BMK</span>
          <select class="bookmark-sel chip-select" aria-label="Recall bookmark"><option value="">—</option></select>
        </label>
        <label class="chip chip-sql" title="Squelch threshold">
          <span class="chip-select-prefix">SQL<b class="squelch-val"></b></span>
          <input class="squelch" type="range" min="0" max="100" step="1">
        </label>
      </div>

      <!-- Panadapter + waterfall -->
      <canvas class="spectrum" tabindex="0"
              aria-label="Live panadapter and waterfall. Click or drag to tune, use the wheel or left/right arrows to step (Shift for ten steps), or drag a filter edge."></canvas>

      <div class="rx-status">
        <span class="spectrum-status">Waiting for spectrum</span>
        <label class="prof-select">
          <span>Spectrum</span>
          <select class="spectrum-profile">
            <option>Low</option>
            <option selected>Balanced</option>
            <option>High</option>
            <option>Ultra</option>
          </select>
        </label>
      </div>
      <audio class="rx-audio" hidden></audio>
    </article>
  </template>

  <footer class="bottom-bar" aria-label="Transmit and status">
    <div class="panel panel-transmit">
      <span class="panel-tag">TRANSMIT</span>
      <button id="tx-control" class="tx-control" type="button" disabled>Take TX control</button>
      <label id="mic-level-wrap" class="mic-level" hidden>
        <span>MIC</span><meter id="mic-level" min="0" max="1" value="0">0</meter>
      </label>
      <button id="tune" class="tune" type="button" disabled>TUNE</button>
      <button id="mox" class="mox" type="button" disabled>MOX</button>
      <div id="tx-settings" class="tx-settings" aria-label="Transmit settings">
        <label title="Transmit drive"><span>DRV <b id="drive-value">0</b></span><input id="drive" type="range" min="0" max="100" step="1"></label>
        <label title="Tune power as a percentage of drive"><span>TUNE <b id="tune-drive-value">0</b></span><input id="tune-drive" type="range" min="0" max="100" step="1"></label>
        <label title="Microphone gain in dB"><span>GAIN <b id="mic-gain-value">0</b></span><input id="mic-gain" type="range" min="-10" max="50" step="1"></label>
        <label title="Speech compressor gain in dB"><span>COMP <b id="comp-level-value">0</b></span><input id="comp-level" type="range" min="0" max="20" step="1"></label>
        <label class="tx-check"><input id="compressor" type="checkbox">COMP</label>
        <label class="tx-check"><input id="leveler" type="checkbox">LVLR</label>
        <label class="tx-check"><input id="cessb" type="checkbox">CESSB</label>
      </div>
      <span id="remote-ptt" class="remote-ptt" hidden>REMOTE PTT</span>
    </div>
    <div class="panel panel-status">
      <span class="panel-tag">STATUS</span>
      <div class="status-copy"><span id="decoder-title"></span><span id="decoder-text"></span><span id="revision">Waiting for radio state</span></div>
    </div>
  </footer>
  <script src="/app.js" defer></script>
</body>
</html>
