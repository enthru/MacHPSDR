# Build + offline self-tests on the two platforms this fork is actually run on.
#
# windows.yml compiles the one target that has never been run on real hardware
# and runs nothing.  This is the other half: it builds the tree on Linux and
# macOS and then runs `make check`, which is every offline self-test in the tree
# (qo100_offline, and hfdl_offline/acars_offline/apt_offline/sstv_offline/
# cw_offline --selftest, whichever the feature flags left linkable).  The most recent reason for this
# file existing is commit 661d476 — the HFDL harness had not linked since VHF
# ACARS landed and nobody noticed, because nothing ever built it.
#
# What this proves: the tree compiles and links on both platforms, the six
# harnesses still LINK (half the value — that is the failure that went unseen),
# and the DSP/decoder layers they cover still produce the expected answers.
#
# There is a third job, `macos-intel`, which does the same for x86_64 macOS and
# runs only on a tag or a manual dispatch.  Its own comment block says why that
# is where the line was drawn -- and it is NOT money, whatever an earlier
# version of this file said.
#
# What it does NOT prove, and must never be written up as proving:
#   - anything about radio hardware.  No HPSDR, no SoapySDR device, no TX.  The
#     self-tests synthesise their own signal; a passing run says the decoder
#     agrees with the test's own modulator, not with the air.
#   - anything about the audio backends.  A runner has no sound card; CoreAudio,
#     ALSA, PulseAudio and JACK are linked here and never opened.
#   - anything about the GUI.  In the `build` job the binary is built and
#     deliberately NEVER STARTED — starting it raises a window and rewrites
#     saved settings, which is why CLAUDE.md forbids it as a test even locally.
#     The `sanitize` job below is the one exception and buys its way out of
#     both objections: Xvfb rather than the operator's display, and a
#     throw-away HOME rather than the operator's settings.  It still walks only
#     the few paths its churn hook drives, not "the GUI".
#   - anything about Windows.  That is windows.yml, and it does not run either.

name: Build + self-tests (macOS, Linux)

on:
  push:
    branches: [master]
    # A tag is a release: the same build, with its .app attached to the release
    # instead of only to the run.  See "Attach to the release" at the end of the
    # build job -- the pattern is a glob, not a regex, so it matches 4.1 and
    # 3.8.1 alike and nothing that does not start with a digit.
    tags: ['[0-9]*']
  pull_request:
    branches: [master]
  workflow_dispatch:

# A run whose ref has moved on is answering a question nobody is asking any
# more: a second commit pushed to master, or a tag re-pointed at a different
# commit, makes the run in flight obsolete the moment it happens.  Cancel it
# rather than let it spend twenty minutes reporting on a commit that is no
# longer what the ref means.  Keyed on the ref, so master, a tag and a pull
# request never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Only so the tag build can create the release and attach the bundle to it;
    # nothing else in this job writes anything back to the repository.
    permissions:
      contents: write
    strategy:
      # Not fail-fast: "broken on both" and "broken on one" are different bugs,
      # and cancelling the sibling job throws away exactly that distinction.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          # The Makefile stamps the build from `git describe`, which needs tags.
          fetch-depth: 0

      # CLAUDE.md's own dependency list, verbatim.  Every package here is in
      # noble's universe, which the runner image enables by default.
      #
      # zlib1g-dev is the one addition: HFDL's Linux branch links -lz (OHMA and
      # MIAM inflate their payloads) and CLAUDE.md's apt line predates that.
      # It is preinstalled on the runner; naming it means this file still works
      # on an image that stops preinstalling it.
      #
      # No liquid-dsp source build here, unlike windows.yml — that exists only
      # because MSYS2 does not package it.  Ubuntu does (universe), so there is
      # nothing expensive to cache: apt and brew are both a fast download of
      # prebuilt packages.  Note the versions differ across the three jobs
      # (noble 1.6.0, Homebrew 1.8.x, windows.yml pinned to v1.7.0); that is
      # tolerated rather than papered over because hfdl_frame.c already
      # branches on liquid_libversion_number() for the msequence_create
      # argument convention that changed at 1.6.0, and running both sides of
      # that branch in CI is worth more than making the versions match.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfftw3-dev \
            libpulse-dev \
            libsoundio-dev \
            libasound2-dev \
            libgtk-4-dev \
            libsoapysdr-dev \
            libliquid-dev \
            zlib1g-dev

      # dylibbundler is here for `make app` at the end of the job — it is the
      # one tool that target refuses to run without.  gnome-icon-theme is an
      # alias for
      # adwaita-icon-theme and is a runtime resource rather than a build
      # dependency, but it is kept so this list stays the one CLAUDE.md
      # documents — a CI environment that has quietly drifted from the
      # documented one is worse than a slightly over-broad install.
      #
      # soapyhackrf / soapyrtlsdr / soapyremote are NOT build dependencies --
      # nothing links against them and `make` does not care.  They are here for
      # `make app`, which copies the SoapySDR driver modules it finds under the
      # Homebrew prefix into the bundle, because SoapySDR dlopens them and
      # dylibbundler therefore cannot see them.  Without them installed the
      # bundle ships libSoapySDR and no drivers, enumerates nothing, and looks
      # to its user like a receiver that cannot see their radio.  That is what
      # 4.1's macOS bundle did.  Homebrew core carries exactly these three.
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          # Every formula here is long-established, so the several minutes an
          # index refresh costs buys nothing.
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install fftw gtk4 gnome-icon-theme libsoundio libffi soapysdr liquid-dsp dylibbundler
          brew install soapyhackrf soapyrtlsdr soapyremote

      # `getconf`, not `nproc`: macOS has no nproc.  This also builds the
      # vendored trees (wdsp/, ft8_lib/, sgp4sdp4/, hfdl_lib/asn1/) through
      # their own makefiles, so a break in any of them shows up here.
      #
      # On failure it rebuilds serially before giving up.  A parallel make
      # interleaves the output of every job, and the vendored asn1 tree alone is
      # 240 files, so the compiler's message ends up hundreds of lines away from
      # the command that produced it — the first failure of this workflow put a
      # `fatal error:` in the middle of an unrelated `ar` line.  The serial pass
      # costs a few minutes only when something is already broken, and it puts
      # the real error at the END of the log, where anyone reading it looks.
      - name: Build
        run: |
          make -j"$(getconf _NPROCESSORS_ONLN)" && exit 0
          echo "::group::parallel build failed - rebuilding serially for a readable error"
          make -j1

      # Builds and runs the harnesses.  Each already exits non-zero on a failed
      # assertion and `check` stops at the first, so a failure names itself.
      # This is the whole test surface: no GUI binary is started.
      - name: Self-tests
        run: make check

      # The decoded pictures behind the SSTV numbers.  `make check` asserts an
      # MAE/PSNR per mode, which says PASS or FAIL and nothing about *how* a
      # picture is wrong — a slant, a colour swap and a chroma error all move
      # the same number.  These are the same eight decodes the self-test just
      # made, written out, so a threshold that starts drifting can be looked at
      # instead of argued about.  Seconds to produce, a few hundred kB.
      - name: Decoded self-test images
        run: |
          mkdir -p selftest-images
          ./sstv_offline --selftest -o selftest-images/sstv

      - name: Upload decoded images
        uses: actions/upload-artifact@v7
        with:
          name: selftest-images-${{ matrix.os }}
          path: selftest-images/
          if-no-files-found: error

      # The .app, for the platform this fork exists for.  windows.yml uploads a
      # package because nobody here can build one; this one is uploaded for the
      # opposite reason — it is buildable locally, but a per-commit bundle is
      # what lets a second Mac run the change without a toolchain on it.
      #
      # ditto, not upload-artifact directly: a .app is a directory of symlinks
      # and executable bits, and the zip actions/upload-artifact makes keeps
      # neither.  Zipping it here means what you download is the bundle.
      #
      # It is ad-hoc signed (`codesign --sign -`, what `make app` does) and NOT
      # NOTARIZED, so Gatekeeper refuses it on any other machine until it is
      # opened once from the context menu, or the quarantine attribute is
      # stripped.  It is also arm64 only, because macos-latest is -- which is
      # why the file says so in its name on a release as well as here.  Both
      # were true of the bundles built by hand for every release up to 4.0; what
      # is new is that the file now says which it is.
      - name: Bundle the .app (macOS)
        if: runner.os == 'macOS'
        run: |
          make app
          ditto -c -k --keepParent MacHPSDR.app MacHPSDR-arm64.zip

      # A bundle with libSoapySDR and no driver modules is the failure this
      # release process has already shipped once: it builds, it signs, it
      # launches, and it finds no SDR on any machine that does not have
      # Homebrew's drivers installed itself.  Nothing in `make app` can fail on
      # it, because a bundle with no drivers is legitimate for an HPSDR-only
      # build -- so the assertion belongs here, where the artifact is a release.
      - name: Check the bundle carries its SoapySDR drivers
        if: runner.os == 'macOS'
        run: |
          set -e
          mods=$(find MacHPSDR.app/Contents/Resources/lib/SoapySDR -name '*.so' 2>/dev/null | wc -l | tr -d ' ')
          [ "$mods" -gt 0 ] || { echo "no SoapySDR driver modules in the bundle"; exit 1; }
          find MacHPSDR.app/Contents/Resources/lib/SoapySDR -name '*.so' -exec basename {} \;
          # The drivers drag libhackrf and libusb in behind them; a module left
          # pointing at /opt/homebrew is a module that will not load anywhere
          # else, which is invisible until someone else runs the bundle.
          if find MacHPSDR.app/Contents/Resources/lib/SoapySDR -name '*.so' -exec otool -L {} \; \
             | grep -E '^[[:space:]]+/(opt/homebrew|usr/local)/' ; then
            echo "a driver module still links outside the bundle"; exit 1
          fi
          echo "SoapySDR drivers: $mods, all self-contained"

      - name: Upload the .app (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: MacHPSDR-app-arm64
          path: MacHPSDR-arm64.zip
          if-no-files-found: error

      # The release, built by the same job that just ran `make check` -- so an
      # asset exists only for a tag whose self-tests passed on this platform.
      #
      # The body is left EMPTY on purpose: every release so far has carried its
      # notes in the annotated tag's own message, which GitHub renders when the
      # release has no body of its own.  So the notes are written once, in
      # `git tag -a`, and travel with the repository rather than living only in
      # a web form.
      #
      # This job and the Windows one race to be the first here, and neither can
      # wait for the other (they are separate workflows).  Hence create-or-find
      # rather than create: whichever arrives first makes the release, the other
      # finds it and uploads beside it.  --clobber so a re-run replaces its own
      # asset instead of failing on the name.
      - name: Attach to the release (tag builds only)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          for i in 1 2 3 4 5; do
            gh release view "$TAG" >/dev/null 2>&1 && break
            gh release create "$TAG" --verify-tag --title "" --notes "" && break
            sleep $((i * 5))
          done
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" MacHPSDR-arm64.zip --clobber

  # ===========================================================================
  # The Intel bundle, for the Macs that are not Apple silicon.
  #
  # IT COSTS NOTHING, and the correction matters because this file said the
  # opposite for one commit.  macos-15-intel is a STANDARD runner -- 4-core
  # Intel, 14 GB, free and unlimited on a public repository, exactly like
  # macos-latest.  It reads as a billed `-large` image in the runner-images
  # README, which lists "macos-15-large or macos-15-intel" in one row, and that
  # misreading is what the first version of this job was designed around.  The
  # measurement that settles it: /actions/runs/<id>/timing on the run that first
  # built this bundle reports MACOS total_ms 0 across both macOS jobs.
  #
  # So the gate below is about attention, not money.  This is a compile of the
  # same sources the arm64 job has just built and self-tested; both targets are
  # 64-bit little-endian, so an endianness or pointer-size assumption shows on
  # neither, and what is left for this job alone to catch is x86-only compiler
  # behaviour and a Homebrew formula that exists for one architecture and not
  # the other.  Three minutes per tag buys that; three minutes per commit, plus
  # a second red X to triage on every push, does not.  What it gives up is that
  # an Intel-only break surfaces on release day -- flip the `if:` to run it on
  # every push the first time that actually costs an evening.
  #
  # A JOB OF ITS OWN AND NOT A THIRD MATRIX ENTRY, because a matrix entry cannot
  # carry that condition: `jobs.<id>.if` has no access to the matrix context, so
  # there is nowhere for it to live but a separate job.
  #
  # macos-15-intel rather than macos-26-intel deliberately: it is the older of
  # the two GA Intel images, so the bundle it produces will load on the older
  # systems an Intel Mac is likely to still be running.
  # ===========================================================================
  macos-intel:
    name: macos-15-intel
    runs-on: macos-15-intel
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # The Makefile stamps the build from `git describe`, which needs tags.
          fetch-depth: 0

      # The same list as the arm64 job, and it must stay the same list: an
      # Intel-only formula quietly appearing here is exactly the drift this
      # job exists to catch.
      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install fftw gtk4 gnome-icon-theme libsoundio libffi soapysdr liquid-dsp dylibbundler
          brew install soapyhackrf soapyrtlsdr soapyremote

      - name: Build
        run: |
          make -j"$(getconf _NPROCESSORS_ONLN)" && exit 0
          echo "::group::parallel build failed - rebuilding serially for a readable error"
          make -j1

      # Not a formality on this job: these are the x86_64 binaries, run on
      # x86_64, so a shipped Intel bundle whose DSP or decoders disagree with
      # the arm64 one fails here rather than in an operator's shack.
      - name: Self-tests
        run: make check

      - name: Bundle the .app
        run: |
          make app
          ditto -c -k --keepParent MacHPSDR.app MacHPSDR-x86_64.zip

      # A bundle with libSoapySDR and no driver modules is the failure this
      # release process has already shipped once: it builds, it signs, it
      # launches, and it finds no SDR on any machine that does not have
      # Homebrew's drivers installed itself.  Nothing in `make app` can fail on
      # it, because a bundle with no drivers is legitimate for an HPSDR-only
      # build -- so the assertion belongs here, where the artifact is a release.
      - name: Check the bundle carries its SoapySDR drivers
        run: |
          set -e
          mods=$(find MacHPSDR.app/Contents/Resources/lib/SoapySDR -name '*.so' 2>/dev/null | wc -l | tr -d ' ')
          [ "$mods" -gt 0 ] || { echo "no SoapySDR driver modules in the bundle"; exit 1; }
          find MacHPSDR.app/Contents/Resources/lib/SoapySDR -name '*.so' -exec basename {} \;
          # The drivers drag libhackrf and libusb in behind them; a module left
          # pointing at /opt/homebrew is a module that will not load anywhere
          # else, which is invisible until someone else runs the bundle.
          if find MacHPSDR.app/Contents/Resources/lib/SoapySDR -name '*.so' -exec otool -L {} \; \
             | grep -E '^[[:space:]]+/(opt/homebrew|usr/local)/' ; then
            echo "a driver module still links outside the bundle"; exit 1
          fi
          echo "SoapySDR drivers: $mods, all self-contained"

      - name: Upload the .app
        uses: actions/upload-artifact@v7
        with:
          name: MacHPSDR-app-x86_64
          path: MacHPSDR-x86_64.zip
          if-no-files-found: error

      # Same create-or-find as the arm64 job: three jobs across two workflows
      # race for the release and none of them can wait for the others.
      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          for i in 1 2 3 4 5; do
            gh release view "$TAG" >/dev/null 2>&1 && break
            gh release create "$TAG" --verify-tag --title "" --notes "" && break
            sleep $((i * 5))
          done
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" MacHPSDR-x86_64.zip --clobber

  # ===========================================================================
  # ASan + UBSan + LeakSanitizer, Linux only.
  #
  # LINUX ONLY IS THE WHOLE POINT.  `make SANITIZE=1 check` already runs on a
  # Mac and catches use-after-free, overflows and undefined behaviour there, so
  # a macOS copy of this job would add nothing — but LeakSanitizer has no
  # Darwin support at all, so ASAN_OPTIONS=detect_leaks=1 is silently ignored
  # and half of what the sanitisers are for is unreachable on the machine this
  # fork is developed on.  This job is that half.
  #
  # It does two things the `build` job cannot:
  #
  #   1. runs the whole offline self-test set instrumented, with leak detection
  #      ON.  Its first run found a 20 MB buffer that apt_offline's noise case
  #      never freed, and an upstream liquid-dsp one — neither visible to any
  #      number of macOS runs.
  #   2. STARTS THE GUI, under Xvfb, with MACHPSDR_RX_CHURN driving the
  #      add/close cycle that is otherwise reachable only by clicking.  That
  #      cycle ends in delete_receiver, which frees the receiver, its WDSP
  #      channel and its analyzer; before it existed a close leaked ~1.2 GB.
  #      Whether anything is STILL leaked per cycle was an open question in
  #      CLAUDE.md that no macOS run could answer, and answering it needs the
  #      program actually run, not a harness linked against parts of it.
  #
  #      It does that FOUR times, once for each protocol path this tree can
  #      drive with no hardware: PROTOCOL_FAKE, protocol 1 through metis_emu,
  #      protocol 2 through p2_emu (with the diversity mixer's create and
  #      teardown on top), and SoapySDR through the null module in
  #      tools/soapy_null.cpp.  Four runs and not one because the teardown is
  #      per-protocol and barely shared: only the SoapySDR path owns a receive
  #      thread and an RX stream PER RECEIVER, only protocol 2 pairs DDC0/DDC1
  #      through a diversity mixer, and only protocol 1 reaches its output path
  #      from inside add_iq_samples.  A leak or a use-after-free in any one of
  #      those is invisible to the other three, which is exactly how each of
  #      them arrived: the SoapySDR run found a leaked receive thread and RX
  #      stream on its first execution ever, and the protocol-1 run found the
  #      output-path self-deadlock.
  #
  # WHAT A GREEN RUN HERE PROVES, AND NOTHING MORE:
  #   - the self-tests are clean under ASan/UBSan/LSan on Linux;
  #   - the paths the churn hook actually walks are free of ASan errors and of
  #     unreachable leaks: start-up, discovery, create_receiver/create_visual,
  #     add_receiver, receiver_close/delete_receiver, and the DSP + panadapter
  #     + waterfall + VFO code that runs while a receiver is streaming --
  #     on all four of PROTOCOL_FAKE, protocol 1, protocol 2 and SoapySDR, plus
  #     the diversity mixer's enable/disable on protocol 2.
  #
  # WHAT IT SAYS NOTHING ABOUT, and must never be written up as covering:
  #   - THE RADIOS.  Every one of the four runs is answered by something in
  #     this tree -- the faker, metis_emu, p2_emu, tools/soapy_null.cpp -- so
  #     each agrees with this tree's own reading of protocol 1, protocol 2 and
  #     the SoapySDR API.  They catch the app and the emulator drifting apart;
  #     they cannot catch a misreading the two share, and no register whose
  #     semantics nobody here parses (filters, ALEX, attenuators, OC bits) is
  #     touched by any of them.  soapy_null is a plugin against SoapySDR's ABI
  #     rather than a wire format, so it exercises the calls soapy_protocol.c
  #     makes into libSoapySDR and says nothing whatever about how a real
  #     driver answers them.
  #   - PURESIGNAL, on either protocol.  Nothing here enables it, and the P2
  #     feedback path needs TX hardware to close its loop at all.
  #   - the audio backends.  A runner has no sound card: soundio falls back to
  #     its Dummy backend, so ALSA, PulseAudio, JACK and CoreAudio are linked
  #     and never opened.
  #   - THE GUI, in any general sense.  Nothing here clicks a dialog, opens a
  #     Configure page, drags the panadapter or selects a decoder.  Two windows
  #     and one timer-driven button path is the entire surface.
  #   - TX anything.  MOX is never keyed.
  #   - LEAKS THAT ARE STILL REACHABLE.  LeakSanitizer reports blocks nothing
  #     points at any more.  A list that only ever grows, or a cache that is
  #     never evicted, is reachable from a global and is INVISIBLE here — so
  #     "no leaks" means "nothing unreachable was left behind", which is not
  #     the same claim as "memory does not grow".
  #   - anything about radio hardware.  metis_emu is a program in this tree
  #     answering the protocol-1 packet layout this tree also parses; it agrees
  #     with our own reading of the protocol, not with a board.
  sanitize:
    name: ubuntu-latest (ASan + UBSan + LeakSanitizer)
    runs-on: ubuntu-latest
    # NOT on a tag.  This job is twenty minutes of instrumented GUI runs, and a
    # tag points at a commit that has already been through it on master -- the
    # same tree, the same four leak checks, the same answer.  Re-running it
    # because a ref was created delays the release and tells nobody anything.
    # The gap, stated: a tag placed on a commit that never sat on master gets
    # its release without the leak check.  Nothing in this repository is
    # released that way, and if it ever is, `workflow_dispatch` runs this job.
    if: "!startsWith(github.ref, 'refs/tags/')"

    # A SEPARATE JOB, not another matrix leg of `build`, and it has to be:
    # SANITIZE=1 rides in OPTIONS, .build-flags compares OPTIONS, and objects
    # land in the repo root under fixed names — so a sanitised and an ordinary
    # build of this tree cannot share a checkout without silently rebuilding
    # each other from scratch, or worse, linking a mixture.
    env:
      # detect_leaks is on by default for ASan on Linux; named anyway so that
      # reading this job tells you what it is doing.
      ASAN_OPTIONS: detect_leaks=1
      # Deliberately NOT fast_unwind_on_malloc=0.  It gives prettier stacks and
      # costs an unwind on every allocation, which under FFTW's wisdom planning
      # (tens of millions of allocations on a cold HOME) turned a 4-minute
      # start-up into one that had not finished in fifteen.  The tree is built
      # -fno-omit-frame-pointer, so the fast unwinder's stacks are good enough
      # to name a leak; every stack quoted in the fixes this job produced came
      # out of it.
      # print_suppressions=1 on purpose: it prints a per-template count and byte
      # total at exit even on a green run, which is the only way anyone notices
      # a suppression quietly growing to cover something it should not.  Three
      # lines of log for the one number that keeps this file honest.
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/lsan-suppressions.txt:print_suppressions=1
      UBSAN_OPTIONS: print_stacktrace=1
      # GTK4 on a headless runner: Xvfb is a plain X server with no GL, so name
      # the X11 backend rather than letting GDK look for Wayland first, and put
      # GSK on its software renderer.  ngl/vulkan both fail here and GSK's
      # fallback chain is noisy about it; cairo just works.
      GDK_BACKEND: x11
      GSK_RENDERER: cairo
      LIBGL_ALWAYS_SOFTWARE: 1

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The `build` job's Linux list, plus xvfb/xauth for the churn steps.
      # xauth is not optional: xvfb-run writes an auth file and X refuses the
      # connection without it.
      #
      # g++ is here for one step and one step only: tools/soapy_null.cpp is C++
      # (SoapySDR's plugin ABI is a C++ class), and this tree is C, so a runner
      # image that can build the app does not by that fact have a C++ compiler.
      # Named for the same reason as zlib1g-dev above -- it is preinstalled
      # today, and this file should still work on an image that stops
      # preinstalling it.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfftw3-dev \
            libpulse-dev \
            libsoundio-dev \
            libasound2-dev \
            libgtk-4-dev \
            libsoapysdr-dev \
            libliquid-dev \
            zlib1g-dev \
            g++ \
            xvfb xauth

      # The app and both packet emulators, so every churn step below has its
      # radio.  The serial retry is the `build` job's, for the same reason: an
      # instrumented build is no more readable in parallel than an ordinary one.
      # `all` is named explicitly ALONGSIDE metis-emu and p2-emu, and that is
      # the whole story of this step: naming only `metis-emu` builds ONLY
      # metis_emu, so the app is never linked and the churn steps below die on
      # "./machpsdr: not found" twenty minutes later.  That is exactly what the
      # first run of this job did.
      #
      # Hence the assertion after it.  A build step that leaves no binary must
      # fail HERE, where the reason is one line up, and not in a later step
      # whose error message is about something else entirely -- the same rule
      # as the "cycles completed" check further down.
      - name: Build (SANITIZE=1)
        run: |
          make SANITIZE=1 -j"$(getconf _NPROCESSORS_ONLN)" all metis-emu p2-emu \
            || { echo "::group::parallel build failed - rebuilding serially for a readable error"; \
                 make SANITIZE=1 -j1 all metis-emu p2-emu; }
          for f in ./machpsdr ./metis_emu ./p2_emu; do
            [ -x "$f" ] || { echo "::error::$f was not built - the churn steps cannot run"; exit 1; }
          done
          ls -l machpsdr metis_emu p2_emu

      # The SoapySDR path has no wire to fake -- it is a plugin ABI, not a
      # packet layout -- so its stand-in is a MODULE that enumerates, opens and
      # streams, and the app finds it only because SOAPY_SDR_PLUGIN_PATH names
      # the directory below.  Nothing else in this job or in `make` builds it:
      # it is opt-in twice over (a C++ fixture in a C tree, and a fake radio
      # that must never be loadable by an ordinary run).
      #
      # DELIBERATELY NOT BUILT WITH THE SANITISERS, though it is dlopen'd into a
      # process that has them.  ASan's allocator interception is process-wide,
      # so every allocation this module makes still goes through ASan's
      # allocator and LeakSanitizer still reports whatever it forgets -- the
      # same reason CLAUDE.md gives for the vendored trees, which are also
      # uninstrumented and also covered.  Instrumenting it would add redzones
      # and UB checks to the FIXTURE, which is not the code under test, and
      # would leave a module no unsanitised process (SoapySDRUtil, an ordinary
      # ./machpsdr) could load.  The script builds it -g -fno-omit-frame-pointer
      # instead, which is what the fast unwinder needs to name a function if a
      # leak's stack ever does pass through it.
      #
      # It is built HERE, next to the other builds and before the long
      # self-test step, so a missing C++ compiler fails in ten seconds with the
      # reason on screen rather than twenty minutes later as "the plugin does
      # not register".
      - name: Build the SoapySDR null module
        run: |
          tools/build-soapy-null.sh
          ls -l build/soapy-null/

      # The same harnesses the `build` job runs, instrumented and with leak
      # detection on.  UBSan is built -fno-sanitize-recover=undefined, so
      # undefined behaviour exits non-zero here rather than printing a warning
      # into a log nobody reads.
      - name: Self-tests under ASan + UBSan + LSan
        run: make SANITIZE=1 check

      # --- the churn runs ---------------------------------------------------
      #
      # HOME is a directory of this job's own, for the reason CLAUDE.md gives:
      # the app rewrites its saved settings on exit.  It is shared BETWEEN the
      # four churn steps on purpose — WDSP plans its FFT wisdom into $HOME on
      # first run and that takes minutes under ASan, so every step after the
      # first reuses what it planned.  Each device keeps its own props file
      # (named after the device), so sharing the directory does not mean one
      # step inheriting another's settings.
      - name: Prepare a throw-away HOME
        run: |
          echo "MACHPSDR_HOME=$(mktemp -d)" >> "$GITHUB_ENV"

      # PROTOCOL_FAKE.  --faker with no file synthesises noise + tones and
      # skips the device-selection window, and the fake device advertises two
      # receivers, which is what gives rx_churn_tick a spare slot to work with.
      #
      # The `cycles completed` check is the load-bearing part of this step.
      # A run that died during start-up leaks almost nothing and exits 0, so
      # without it the step would go green precisely when it had tested
      # nothing — the failure mode a CI job like this is most likely to rot
      # into.
      - name: Leak check - receiver add/close, fake device
        run: |
          set -u
          export HOME="$MACHPSDR_HOME"
          export MACHPSDR_RX_CHURN=6
          rc=0
          timeout -k 30 2400 xvfb-run -a -s "-screen 0 1280x900x24" \
            ./machpsdr --faker > churn-faker.log 2>&1 || rc=$?
          echo "machpsdr exited $rc"
          grep -E "rx-churn" churn-faker.log || true
          if ! grep -q "add/close cycles completed" churn-faker.log; then
            echo "::error::the churn never ran to completion - this step proved nothing"
            tail -80 churn-faker.log
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::group::sanitiser report"
            sed -n '/ERROR: \(Address\|Leak\|Undefined\)/,$p' churn-faker.log
            echo "::endgroup::"
            exit 1
          fi

      # PROTOCOL 1, through tools/metis_emu.c — a software HPSDR board, a
      # separate process speaking real UDP.  This is the only thing in the tree
      # that runs protocol1.c's receive thread, its EP2 command stream and the
      # output path reached from inside add_iq_samples, all of which take
      # delete_rx_mutex around radio->receiver[] and none of which the faker
      # goes near.  It is also the run that found protocol 1's output-path
      # self-deadlock in the first place.
      #
      # --pace 8 is not a nicety: an instrumented build is about an order of
      # magnitude slower than wall clock, so a real-time 192 kHz feed buries it
      # and the app freezes on its last frame with the churn timer never
      # firing.  That is the harness outrunning the app, not a bug in either.
      #
      # metis_emu is killed in an `always()` step rather than at the end of
      # this one, so a timeout here cannot leave it running.
      - name: Leak check - receiver add/close, Protocol 1 (metis_emu)
        run: |
          set -u
          export HOME="$MACHPSDR_HOME"
          export MACHPSDR_RX_CHURN=4
          ./metis_emu --pace 8 --quiet > metis-emu.log 2>&1 &
          sleep 2
          rc=0
          timeout -k 30 2400 xvfb-run -a -s "-screen 0 1280x900x24" \
            ./machpsdr --open Hermes > churn-p1.log 2>&1 || rc=$?
          echo "machpsdr exited $rc"
          grep -E "rx-churn|--open" churn-p1.log || true
          if ! grep -q "add/close cycles completed" churn-p1.log; then
            echo "::error::the churn never ran to completion - this step proved nothing"
            echo "::group::metis_emu"; tail -30 metis-emu.log; echo "::endgroup::"
            tail -80 churn-p1.log
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::group::sanitiser report"
            sed -n '/ERROR: \(Address\|Leak\|Undefined\)/,$p' churn-p1.log
            echo "::endgroup::"
            exit 1
          fi

      # pkill on the name, not a PID carried through GITHUB_ENV: this step runs
      # even when an earlier one failed and never started the emulator, and
      # `kill "${PID:-0}"` with the variable unset is `kill 0`, which signals
      # the whole process group — i.e. the runner's own step shell.  The
      # bracket in '[m]etis_emu' keeps the pattern from matching pkill itself.
      - name: Stop metis_emu
        if: always()
        run: pkill -f '[m]etis_emu' || true

      # PROTOCOL 2, through tools/p2_emu.c, with the diversity mixer on top.
      # This is not metis_emu with different numbers.  Protocol 2 gives every
      # register block and every DDC stream its own UDP port and the app
      # dispatches on the SOURCE port, so this is the only run in existence
      # that executes protocol2.c's port switch, the mutex-guarded
      # receive_specific register block, and process_div_iq_data's unpacking of
      # a synchronised DDC0/DDC1 pair — which arrives sample-INTERLEAVED on the
      # base DDC's port, not as two streams, and is the shape the P2 PureSignal
      # path is documented as still getting wrong.
      #
      # MACHPSDR_DIVERSITY=2 composes with the churn on purpose; radio.c
      # documents the pairing.  Switching diversity on adds a hidden receiver
      # and a mixer, and the =2 also switches it OFF and on again — the only
      # operator-reachable path that deletes a receiver carrying a mixer, i.e.
      # the mutually recursive delete_receiver/delete_diversity_mixer pair that
      # once hung the whole UI by re-locking a non-recursive GMutex.  The churn
      # cannot reach it by itself: protocol 2 pins diversity to receiver 0,
      # which has no close button.
      #
      # EXPECTED IN A CLEAN LOG, and not a failure: at most a line or two of
      # "diversity-test: receiver 1 is in use".  The churn and the diversity
      # toggle are two timers at 1500 and 1300 ms, so they do collide; when
      # they do, diversity_test_on refuses (P2 needs the DDC0/DDC1 pair free)
      # and takes the next tick instead.  The step is asserted on cycles
      # completed, not on a silent log.
      - name: Leak check - receiver add/close + diversity, Protocol 2 (p2_emu)
        run: |
          set -u
          export HOME="$MACHPSDR_HOME"
          export MACHPSDR_RX_CHURN=4
          export MACHPSDR_DIVERSITY=2
          ./p2_emu --pace 8 --quiet > p2-emu.log 2>&1 &
          sleep 2
          rc=0
          # 600 and not the 2400 above, because the failure mode of an --open
          # step is a WAIT, not a crash: a device the emulator did not answer
          # for leaves the app sitting in the device-selection window for a
          # click that is never coming, and every second of the timeout is a
          # runner doing nothing before the "cycles completed" check gets to
          # say so.  Measured at ~20 s for this step in an ubuntu:24.04
          # container, so 600 is thirty times over.
          timeout -k 30 600 xvfb-run -a -s "-screen 0 1280x900x24" \
            ./machpsdr --open Angelia > churn-p2.log 2>&1 || rc=$?
          echo "machpsdr exited $rc"
          grep -E "rx-churn|diversity-test|--open" churn-p2.log || true
          if ! grep -q "add/close cycles completed" churn-p2.log; then
            echo "::error::the churn never ran to completion - this step proved nothing"
            echo "::group::p2_emu"; tail -30 p2-emu.log; echo "::endgroup::"
            tail -80 churn-p2.log
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::group::sanitiser report"
            sed -n '/ERROR: \(Address\|Leak\|Undefined\)/,$p' churn-p2.log
            echo "::endgroup::"
            exit 1
          fi

      - name: Stop p2_emu
        if: always()
        run: pkill -f '[p]2_emu' || true

      # PROTOCOL 2 PURESIGNAL.  A separate p2_emu because the feedback pair only
      # exists on a board that has one: ps_tx_fdbk_chan is set for Orion2 alone,
      # hence --board 5, and --receivers 8 because switching PureSignal on
      # allocates receiver slots up to that channel.
      #
      # This step KEYS THE TRANSMITTER (MACHPSDR_PS_TEST), which against the
      # emulator is a UDP stream and nothing else.  It is the only thing that
      # executes the feedback register block in protocol2_receive_specific and
      # process_ps_iq_data's unpacking of the DDC0/DDC1 pair — both of which
      # were unreachable without a checkbox and a held MOX button, which is how
      # a pairing the protocol forbids (sync DDC3 to DDC4) and an unpacker built
      # for two streams that only ever arrive as one survived in the tree.
      #
      # MACHPSDR_PS_CYCLES=3 is the teardown half, and it is where the bugs
      # were: switching PureSignal off deletes the hidden feedback receivers
      # while the protocol thread is still delivering into them.  The first run
      # of this found a heap-buffer-overflow in add_ps_iq_samples and an
      # intermittent abort inside WDSP's CloseChannel.
      #
      # BOTH greps are load-bearing.  "cycles completed" says the sequence ran;
      # "feedback pair streaming on DDC0" says the radio actually answered with
      # an interleaved pair, i.e. that the register block asked for something a
      # board can honour.  A run that only satisfies the first tested the UI
      # path and nothing on the wire.
      - name: Leak check - PureSignal feedback pair, Protocol 2 (p2_emu)
        run: |
          set -u
          export HOME="$MACHPSDR_HOME"
          export MACHPSDR_PS_TEST=4
          export MACHPSDR_PS_CYCLES=3
          ./p2_emu --board 5 --receivers 8 --pace 8 --quiet > p2-emu-ps.log 2>&1 &
          sleep 2
          rc=0
          timeout -k 30 600 xvfb-run -a -s "-screen 0 1280x900x24" \
            ./machpsdr --open Orion > ps-p2.log 2>&1 || rc=$?
          echo "machpsdr exited $rc"
          grep -E "ps-test|PureSignal" ps-p2.log || true
          if ! grep -q "PureSignal transmit cycles completed" ps-p2.log; then
            echo "::error::the PureSignal cycles never ran to completion - this step proved nothing"
            echo "::group::p2_emu"; tail -30 p2-emu-ps.log; echo "::endgroup::"
            tail -80 ps-p2.log
            exit 1
          fi
          if ! grep -q "feedback pair streaming on DDC0" ps-p2.log; then
            echo "::error::no feedback data ever arrived - the DDC pair was never streamed"
            echo "::group::p2_emu"; tail -30 p2-emu-ps.log; echo "::endgroup::"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::group::sanitiser report"
            sed -n '/ERROR: \(Address\|Leak\|Undefined\)/,$p' ps-p2.log
            echo "::endgroup::"
            exit 1
          fi

      - name: Stop p2_emu (PureSignal)
        if: always()
        run: pkill -f '[p]2_emu' || true

      # SoapySDR, through the null module built above.  This is the only thing
      # anywhere that runs soapy_protocol.c: SoapySDRDevice_make, the RX stream
      # and the receive thread that are created PER RECEIVER, and the teardown
      # that stops both from delete_receiver() BEFORE it takes delete_rx_mutex
      # (that thread takes the same lock around every block it delivers, so
      # joining it under the lock is the self-deadlock protocol 1 taught).  It
      # earned its keep the first time it was ever executed: a receive thread
      # and an RX stream were leaking on every single close, which no amount of
      # reading had found.
      #
      # MACHPSDR_NULL_PACE=8 is metis_emu's --pace for the same reason — an
      # instrumented build runs about an order of magnitude slower than wall
      # clock, and an app buried by a real-time feed never fires the churn
      # timer at all.
      #
      # No process to stop afterwards, and no `if: always()` step to do it:
      # this emulator is a shared object inside the app, so it goes when the
      # app goes.
      - name: Leak check - receiver add/close, SoapySDR (null module)
        run: |
          set -u
          export HOME="$MACHPSDR_HOME"
          export MACHPSDR_RX_CHURN=4
          export MACHPSDR_NULL_PACE=8
          export SOAPY_SDR_PLUGIN_PATH="$PWD/build/soapy-null"
          rc=0
          # 600, for the reason the Protocol 2 step above gives.  Verified by
          # deleting the module and running this step: the app discovers no
          # machpsdrnull, falls back to the selection window, and the run is
          # only ended by the timeout -- after which "cycles completed" is
          # missing and the step fails, correctly, but forty minutes late if
          # the number is 2400.
          timeout -k 30 600 xvfb-run -a -s "-screen 0 1280x900x24" \
            ./machpsdr --open machpsdrnull > churn-soapy.log 2>&1 || rc=$?
          echo "machpsdr exited $rc"
          grep -E "rx-churn|--open|machpsdrnull: (setup|close)Stream" churn-soapy.log || true
          if ! grep -q "add/close cycles completed" churn-soapy.log; then
            echo "::error::the churn never ran to completion - this step proved nothing"
            tail -80 churn-soapy.log
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::group::sanitiser report"
            sed -n '/ERROR: \(Address\|Leak\|Undefined\)/,$p' churn-soapy.log
            echo "::endgroup::"
            exit 1
          fi

      # The logs are the product of this job when it fails: a sanitiser report
      # is a hundred lines of stack that the step summary truncates.  Uploaded
      # only on failure — a green run's logs are 40 MB of DSP chatter nobody
      # will ever open.
      - name: Upload churn logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sanitize-logs
          path: |
            churn-faker.log
            churn-p1.log
            churn-p2.log
            churn-soapy.log
            ps-p2.log
            metis-emu.log
            p2-emu.log
            p2-emu-ps.log
          if-no-files-found: warn
