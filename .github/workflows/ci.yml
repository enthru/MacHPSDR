# Build + offline self-tests on the two platforms this fork is actually run on.
#
# windows.yml compiles the one target that has never been run on real hardware
# and runs nothing.  This is the other half: it builds the tree on Linux and
# macOS and then runs `make check`, which is every offline self-test in the tree
# (qo100_offline, and hfdl_offline/acars_offline/apt_offline/sstv_offline/
# cw_offline --selftest, whichever the feature flags left linkable).  The most recent reason for this
# file existing is commit 661d476 — the HFDL harness had not linked since VHF
# ACARS landed and nobody noticed, because nothing ever built it.
#
# What this proves: the tree compiles and links on both platforms, the six
# harnesses still LINK (half the value — that is the failure that went unseen),
# and the DSP/decoder layers they cover still produce the expected answers.
#
# What it does NOT prove, and must never be written up as proving:
#   - anything about radio hardware.  No HPSDR, no SoapySDR device, no TX.  The
#     self-tests synthesise their own signal; a passing run says the decoder
#     agrees with the test's own modulator, not with the air.
#   - anything about the audio backends.  A runner has no sound card; CoreAudio,
#     ALSA, PulseAudio and JACK are linked here and never opened.
#   - anything about the GUI.  In the `build` job the binary is built and
#     deliberately NEVER STARTED — starting it raises a window and rewrites
#     saved settings, which is why CLAUDE.md forbids it as a test even locally.
#     The `sanitize` job below is the one exception and buys its way out of
#     both objections: Xvfb rather than the operator's display, and a
#     throw-away HOME rather than the operator's settings.  It still walks only
#     the few paths its churn hook drives, not "the GUI".
#   - anything about Windows.  That is windows.yml, and it does not run either.

name: Build + self-tests (macOS, Linux)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Not fail-fast: "broken on both" and "broken on one" are different bugs,
      # and cancelling the sibling job throws away exactly that distinction.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          # The Makefile stamps the build from `git describe`, which needs tags.
          fetch-depth: 0

      # CLAUDE.md's own dependency list, verbatim.  Every package here is in
      # noble's universe, which the runner image enables by default.
      #
      # zlib1g-dev is the one addition: HFDL's Linux branch links -lz (OHMA and
      # MIAM inflate their payloads) and CLAUDE.md's apt line predates that.
      # It is preinstalled on the runner; naming it means this file still works
      # on an image that stops preinstalling it.
      #
      # No liquid-dsp source build here, unlike windows.yml — that exists only
      # because MSYS2 does not package it.  Ubuntu does (universe), so there is
      # nothing expensive to cache: apt and brew are both a fast download of
      # prebuilt packages.  Note the versions differ across the three jobs
      # (noble 1.6.0, Homebrew 1.8.x, windows.yml pinned to v1.7.0); that is
      # tolerated rather than papered over because hfdl_frame.c already
      # branches on liquid_libversion_number() for the msequence_create
      # argument convention that changed at 1.6.0, and running both sides of
      # that branch in CI is worth more than making the versions match.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfftw3-dev \
            libpulse-dev \
            libsoundio-dev \
            libasound2-dev \
            libgtk-4-dev \
            libsoapysdr-dev \
            libliquid-dev \
            zlib1g-dev

      # dylibbundler is here for `make app` at the end of the job — it is the
      # one tool that target refuses to run without.  gnome-icon-theme is an
      # alias for
      # adwaita-icon-theme and is a runtime resource rather than a build
      # dependency, but it is kept so this list stays the one CLAUDE.md
      # documents — a CI environment that has quietly drifted from the
      # documented one is worse than a slightly over-broad install.
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          # Every formula here is long-established, so the several minutes an
          # index refresh costs buys nothing.
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install fftw gtk4 gnome-icon-theme libsoundio libffi soapysdr liquid-dsp dylibbundler

      # `getconf`, not `nproc`: macOS has no nproc.  This also builds the
      # vendored trees (wdsp/, ft8_lib/, sgp4sdp4/, hfdl_lib/asn1/) through
      # their own makefiles, so a break in any of them shows up here.
      #
      # On failure it rebuilds serially before giving up.  A parallel make
      # interleaves the output of every job, and the vendored asn1 tree alone is
      # 240 files, so the compiler's message ends up hundreds of lines away from
      # the command that produced it — the first failure of this workflow put a
      # `fatal error:` in the middle of an unrelated `ar` line.  The serial pass
      # costs a few minutes only when something is already broken, and it puts
      # the real error at the END of the log, where anyone reading it looks.
      - name: Build
        run: |
          make -j"$(getconf _NPROCESSORS_ONLN)" && exit 0
          echo "::group::parallel build failed - rebuilding serially for a readable error"
          make -j1

      # Builds and runs the harnesses.  Each already exits non-zero on a failed
      # assertion and `check` stops at the first, so a failure names itself.
      # This is the whole test surface: no GUI binary is started.
      - name: Self-tests
        run: make check

      # The decoded pictures behind the SSTV numbers.  `make check` asserts an
      # MAE/PSNR per mode, which says PASS or FAIL and nothing about *how* a
      # picture is wrong — a slant, a colour swap and a chroma error all move
      # the same number.  These are the same eight decodes the self-test just
      # made, written out, so a threshold that starts drifting can be looked at
      # instead of argued about.  Seconds to produce, a few hundred kB.
      - name: Decoded self-test images
        run: |
          mkdir -p selftest-images
          ./sstv_offline --selftest -o selftest-images/sstv

      - name: Upload decoded images
        uses: actions/upload-artifact@v7
        with:
          name: selftest-images-${{ matrix.os }}
          path: selftest-images/
          if-no-files-found: error

      # The .app, for the platform this fork exists for.  windows.yml uploads a
      # package because nobody here can build one; this one is uploaded for the
      # opposite reason — it is buildable locally, but a per-commit bundle is
      # what lets a second Mac run the change without a toolchain on it.
      #
      # ditto, not upload-artifact directly: a .app is a directory of symlinks
      # and executable bits, and the zip actions/upload-artifact makes keeps
      # neither.  Zipping it here means what you download is the bundle.
      #
      # It is UNSIGNED and NOT NOTARIZED, so Gatekeeper refuses it on any other
      # machine until it is opened once from the context menu (or the quarantine
      # attribute is stripped).  It is also arm64 only, because macos-latest is:
      # this is not a release artifact and must not be described as one.
      - name: Bundle the .app (macOS)
        if: runner.os == 'macOS'
        run: |
          make app
          ditto -c -k --keepParent MacHPSDR.app MacHPSDR-arm64.zip

      - name: Upload the .app (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: MacHPSDR-app-arm64
          path: MacHPSDR-arm64.zip
          if-no-files-found: error

  # ===========================================================================
  # ASan + UBSan + LeakSanitizer, Linux only.
  #
  # LINUX ONLY IS THE WHOLE POINT.  `make SANITIZE=1 check` already runs on a
  # Mac and catches use-after-free, overflows and undefined behaviour there, so
  # a macOS copy of this job would add nothing — but LeakSanitizer has no
  # Darwin support at all, so ASAN_OPTIONS=detect_leaks=1 is silently ignored
  # and half of what the sanitisers are for is unreachable on the machine this
  # fork is developed on.  This job is that half.
  #
  # It does two things the `build` job cannot:
  #
  #   1. runs the whole offline self-test set instrumented, with leak detection
  #      ON.  Its first run found a 20 MB buffer that apt_offline's noise case
  #      never freed, and an upstream liquid-dsp one — neither visible to any
  #      number of macOS runs.
  #   2. STARTS THE GUI, under Xvfb, with MACHPSDR_RX_CHURN driving the
  #      add/close cycle that is otherwise reachable only by clicking.  That
  #      cycle ends in delete_receiver, which frees the receiver, its WDSP
  #      channel and its analyzer; before it existed a close leaked ~1.2 GB.
  #      Whether anything is STILL leaked per cycle was an open question in
  #      CLAUDE.md that no macOS run could answer, and answering it needs the
  #      program actually run, not a harness linked against parts of it.
  #
  # WHAT A GREEN RUN HERE PROVES, AND NOTHING MORE:
  #   - the self-tests are clean under ASan/UBSan/LSan on Linux;
  #   - the paths the churn hook actually walks are free of ASan errors and of
  #     unreachable leaks: start-up, discovery, create_receiver/create_visual,
  #     add_receiver, receiver_close/delete_receiver, and the DSP + panadapter
  #     + waterfall + VFO code that runs while a receiver is streaming.
  #
  # WHAT IT SAYS NOTHING ABOUT, and must never be written up as covering:
  #   - PROTOCOL 2 and SoapySDR.  The faker is PROTOCOL_FAKE and metis_emu is
  #     Protocol 1; neither goes near protocol2.c or soapy_protocol.c, so their
  #     receive threads and their teardown remain reasoned-and-compiled only.
  #   - the audio backends.  A runner has no sound card: soundio falls back to
  #     its Dummy backend, so ALSA, PulseAudio, JACK and CoreAudio are linked
  #     and never opened.
  #   - THE GUI, in any general sense.  Nothing here clicks a dialog, opens a
  #     Configure page, drags the panadapter or selects a decoder.  Two windows
  #     and one timer-driven button path is the entire surface.
  #   - TX anything.  MOX is never keyed.
  #   - LEAKS THAT ARE STILL REACHABLE.  LeakSanitizer reports blocks nothing
  #     points at any more.  A list that only ever grows, or a cache that is
  #     never evicted, is reachable from a global and is INVISIBLE here — so
  #     "no leaks" means "nothing unreachable was left behind", which is not
  #     the same claim as "memory does not grow".
  #   - anything about radio hardware.  metis_emu is a program in this tree
  #     answering the protocol-1 packet layout this tree also parses; it agrees
  #     with our own reading of the protocol, not with a board.
  sanitize:
    name: ubuntu-latest (ASan + UBSan + LeakSanitizer)
    runs-on: ubuntu-latest

    # A SEPARATE JOB, not another matrix leg of `build`, and it has to be:
    # SANITIZE=1 rides in OPTIONS, .build-flags compares OPTIONS, and objects
    # land in the repo root under fixed names — so a sanitised and an ordinary
    # build of this tree cannot share a checkout without silently rebuilding
    # each other from scratch, or worse, linking a mixture.
    env:
      # detect_leaks is on by default for ASan on Linux; named anyway so that
      # reading this job tells you what it is doing.
      ASAN_OPTIONS: detect_leaks=1
      # Deliberately NOT fast_unwind_on_malloc=0.  It gives prettier stacks and
      # costs an unwind on every allocation, which under FFTW's wisdom planning
      # (tens of millions of allocations on a cold HOME) turned a 4-minute
      # start-up into one that had not finished in fifteen.  The tree is built
      # -fno-omit-frame-pointer, so the fast unwinder's stacks are good enough
      # to name a leak; every stack quoted in the fixes this job produced came
      # out of it.
      # print_suppressions=1 on purpose: it prints a per-template count and byte
      # total at exit even on a green run, which is the only way anyone notices
      # a suppression quietly growing to cover something it should not.  Three
      # lines of log for the one number that keeps this file honest.
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/lsan-suppressions.txt:print_suppressions=1
      UBSAN_OPTIONS: print_stacktrace=1
      # GTK4 on a headless runner: Xvfb is a plain X server with no GL, so name
      # the X11 backend rather than letting GDK look for Wayland first, and put
      # GSK on its software renderer.  ngl/vulkan both fail here and GSK's
      # fallback chain is noisy about it; cairo just works.
      GDK_BACKEND: x11
      GSK_RENDERER: cairo
      LIBGL_ALWAYS_SOFTWARE: 1

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The `build` job's Linux list, plus xvfb/xauth for the two churn steps.
      # xauth is not optional: xvfb-run writes an auth file and X refuses the
      # connection without it.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfftw3-dev \
            libpulse-dev \
            libsoundio-dev \
            libasound2-dev \
            libgtk-4-dev \
            libsoapysdr-dev \
            libliquid-dev \
            zlib1g-dev \
            xvfb xauth

      # Both the app and metis_emu, so the second churn step has its radio.
      # The serial retry is the `build` job's, for the same reason: an
      # instrumented build is no more readable in parallel than an ordinary one.
      # `all` is named explicitly ALONGSIDE metis-emu, and that is the whole
      # story of this step: naming only `metis-emu` builds ONLY metis_emu, so
      # the app is never linked and the churn steps below die on
      # "./machpsdr: not found" twenty minutes later.  That is exactly what the
      # first run of this job did.
      #
      # Hence the assertion after it.  A build step that leaves no binary must
      # fail HERE, where the reason is one line up, and not in a later step
      # whose error message is about something else entirely -- the same rule
      # as the "cycles completed" check further down.
      - name: Build (SANITIZE=1)
        run: |
          make SANITIZE=1 -j"$(getconf _NPROCESSORS_ONLN)" all metis-emu \
            || { echo "::group::parallel build failed - rebuilding serially for a readable error"; \
                 make SANITIZE=1 -j1 all metis-emu; }
          for f in ./machpsdr ./metis_emu; do
            [ -x "$f" ] || { echo "::error::$f was not built - the churn steps cannot run"; exit 1; }
          done
          ls -l machpsdr metis_emu

      # The same harnesses the `build` job runs, instrumented and with leak
      # detection on.  UBSan is built -fno-sanitize-recover=undefined, so
      # undefined behaviour exits non-zero here rather than printing a warning
      # into a log nobody reads.
      - name: Self-tests under ASan + UBSan + LSan
        run: make SANITIZE=1 check

      # --- the churn runs ---------------------------------------------------
      #
      # HOME is a directory of this job's own, for the reason CLAUDE.md gives:
      # the app rewrites its saved settings on exit, and a shared HOME would
      # also mean the second step inherits the first's props.  It is shared
      # BETWEEN the two churn steps on purpose, though — WDSP plans its FFT
      # wisdom into $HOME on first run and that takes minutes under ASan, so
      # the second step reuses what the first one planned.
      - name: Prepare a throw-away HOME
        run: |
          echo "MACHPSDR_HOME=$(mktemp -d)" >> "$GITHUB_ENV"

      # PROTOCOL_FAKE.  --faker with no file synthesises noise + tones and
      # skips the device-selection window, and the fake device advertises two
      # receivers, which is what gives rx_churn_tick a spare slot to work with.
      #
      # The `cycles completed` check is the load-bearing part of this step.
      # A run that died during start-up leaks almost nothing and exits 0, so
      # without it the step would go green precisely when it had tested
      # nothing — the failure mode a CI job like this is most likely to rot
      # into.
      - name: Leak check - receiver add/close, fake device
        run: |
          set -u
          export HOME="$MACHPSDR_HOME"
          export MACHPSDR_RX_CHURN=6
          rc=0
          timeout -k 30 2400 xvfb-run -a -s "-screen 0 1280x900x24" \
            ./machpsdr --faker > churn-faker.log 2>&1 || rc=$?
          echo "machpsdr exited $rc"
          grep -E "rx-churn" churn-faker.log || true
          if ! grep -q "add/close cycles completed" churn-faker.log; then
            echo "::error::the churn never ran to completion - this step proved nothing"
            tail -80 churn-faker.log
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::group::sanitiser report"
            sed -n '/ERROR: \(Address\|Leak\|Undefined\)/,$p' churn-faker.log
            echo "::endgroup::"
            exit 1
          fi

      # PROTOCOL 1, through tools/metis_emu.c — a software HPSDR board, a
      # separate process speaking real UDP.  This is the only thing in the tree
      # that runs protocol1.c's receive thread, its EP2 command stream and the
      # output path reached from inside add_iq_samples, all of which take
      # delete_rx_mutex around radio->receiver[] and none of which the faker
      # goes near.  It is also the run that found protocol 1's output-path
      # self-deadlock in the first place.
      #
      # --pace 8 is not a nicety: an instrumented build is about an order of
      # magnitude slower than wall clock, so a real-time 192 kHz feed buries it
      # and the app freezes on its last frame with the churn timer never
      # firing.  That is the harness outrunning the app, not a bug in either.
      #
      # metis_emu is killed in an `always()` step rather than at the end of
      # this one, so a timeout here cannot leave it running.
      - name: Leak check - receiver add/close, Protocol 1 (metis_emu)
        run: |
          set -u
          export HOME="$MACHPSDR_HOME"
          export MACHPSDR_RX_CHURN=4
          ./metis_emu --pace 8 --quiet > metis-emu.log 2>&1 &
          sleep 2
          rc=0
          timeout -k 30 2400 xvfb-run -a -s "-screen 0 1280x900x24" \
            ./machpsdr --open Hermes > churn-p1.log 2>&1 || rc=$?
          echo "machpsdr exited $rc"
          grep -E "rx-churn|--open" churn-p1.log || true
          if ! grep -q "add/close cycles completed" churn-p1.log; then
            echo "::error::the churn never ran to completion - this step proved nothing"
            echo "::group::metis_emu"; tail -30 metis-emu.log; echo "::endgroup::"
            tail -80 churn-p1.log
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::group::sanitiser report"
            sed -n '/ERROR: \(Address\|Leak\|Undefined\)/,$p' churn-p1.log
            echo "::endgroup::"
            exit 1
          fi

      # pkill on the name, not a PID carried through GITHUB_ENV: this step runs
      # even when an earlier one failed and never started the emulator, and
      # `kill "${PID:-0}"` with the variable unset is `kill 0`, which signals
      # the whole process group — i.e. the runner's own step shell.  The
      # bracket in '[m]etis_emu' keeps the pattern from matching pkill itself.
      - name: Stop metis_emu
        if: always()
        run: pkill -f '[m]etis_emu' || true

      # The logs are the product of this job when it fails: a sanitiser report
      # is a hundred lines of stack that the step summary truncates.  Uploaded
      # only on failure — a green run's logs are 40 MB of DSP chatter nobody
      # will ever open.
      - name: Upload churn logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sanitize-logs
          path: |
            churn-faker.log
            churn-p1.log
            metis-emu.log
          if-no-files-found: warn
