# Native Windows build under MSYS2/MinGW-w64.
#
# This is the only place the Windows build is compiled by the toolchain it is
# actually meant for, and the only one that links liquid-dsp — MSYS2 does not
# package it, so HFDL and ACARS cannot be linked anywhere else.
# tools/win-crossbuild.sh covers the same tree from macOS/Linux for a fast local
# check, but it has to switch HFDL off.
#
# The APP is still never run here — a runner has no display, no sound card and
# no radio, and the .exe has only ever been started under Wine, which is enough
# to know it loads and comes up and nothing about WASAPI timing, winmm MIDI, COM
# ports or real adapters, since Wine reimplements all of those.
#
# The offline self-tests ARE run (`make check`, below), and that step is the only
# place any of this tree's code executes on real Windows at all. It covers the
# decoder/DSP layers and the C-runtime seams under them; see the comment on the
# step for what that does and does not settle.

name: Windows (MSYS2)

on:
  push:
    branches: ['release-[0-9]*']
    # The release itself -- see ci.yml's note: the package below is attached to
    # the release only on a tag build, so a missing tag trigger means it is
    # never attached at all.
    tags: ['[0-9]*']

# Same reasoning as ci.yml: a run whose ref has moved on is reporting on a
# commit that is no longer what the ref means.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw64:
    runs-on: windows-latest
    # Only so the tag build can create the release and attach the package to
    # it; nothing else in this job writes back to the repository.
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v7
        with:
          # The Makefile stamps the build from `git describe`, which needs tags.
          fetch-depth: 0

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # autoconf/automake/libtool are MSYS packages (they run the build),
          # everything else is a MINGW64 package (it is linked into the binary).
          install: >-
            git
            make
            autoconf
            automake-wrapper
            libtool
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-libsoundio
            mingw-w64-x86_64-soapysdr
            mingw-w64-x86_64-zlib

      # Pinned to a tag, not a moving master: an unannounced upstream change
      # would otherwise turn into a mystery build failure of THIS tree.
      - name: Cache liquid-dsp
        id: liquid-cache
        uses: actions/cache@v6
        with:
          path: liquid-install
          key: liquid-dsp-v1.7.0-mingw64-1

      # Same script the cross-build harness uses, so the workarounds it carries
      # (MinGW has no -lc and no <sys/resource.h>; liquid's .so rule does not
      # link on Windows) cannot drift between the two.
      - name: Build liquid-dsp
        if: steps.liquid-cache.outputs.cache-hit != 'true'
        run: tools/build-liquid-dsp.sh "$(pwd)/liquid-install"

      - name: Install liquid-dsp into the prefix
        run: |
          set -e
          cp -r liquid-install/include/* /mingw64/include/
          cp -r liquid-install/lib/*      /mingw64/lib/

      - name: Build
        run: make -j"$(nproc)"

      # THE FIRST EXECUTION OF ANY OF THIS TREE'S CODE ON REAL WINDOWS.
      #
      # The offline harnesses are console programs with no GUI, no audio and no
      # hardware, so they are the one part of the tree a CI runner can actually
      # RUN — and running them exercises a great deal that compiling does not:
      # every decoder's arithmetic (HFDL/ACARS through Viterbi and the ASN.1
      # tree, APT georeferencing over SGP4, SSTV/WEFAX image scoring, the CW
      # round trip and keyer state machine, the QO-100 beacon loop's sign), the
      # LLP64 printf rules on a CRT that is not glibc, the time_compat.h and
      # win_compat.h seams, and glib's own behaviour on Windows.  A wrong
      # `%ld` over a size_t, a gmtime_r that is really gmtime_s with its
      # arguments the other way round or a decoder that quietly depends on
      # 64-bit long produce a WRONG ANSWER, not a compile error, and nothing
      # before this step could see one.
      #
      # What it does NOT touch, and must not be written up as touching: WASAPI
      # audio, winmm MIDI, serial CAT over a COM port, GetAdaptersAddresses
      # against real adapters, GTK4's renderer, any dialog or gesture, and radio
      # hardware of any kind.  A runner has no sound card, no display and no
      # radio.  The self-tests also agree with their own modulators rather than
      # with the air — a green run here says the code computes the same answers
      # on Windows that it computes on macOS and Linux, and nothing more.
      #
      # Placed before Package deliberately: packaging is slow and only ships a
      # binary, so there is no reason to build a folder around code whose
      # arithmetic has just been shown wrong.  It runs after Build because it
      # links against the objects Build produced.
      - name: Run the offline self-tests
        run: make check

      - name: Report
        run: |
          file machpsdr.exe
          echo "--- imported DLLs:"
          objdump -p machpsdr.exe | grep -i "DLL Name" | sort

      # Two packaging properties that are invisible in `file` output and are
      # exactly what a build-flag change silently undoes.  Subsystem 2 is GUI:
      # a double-click must not open a stray console, while a launch from a
      # shell still logs there (AttachConsole in win_startup).  `make
      # WIN_CONSOLE=1` is the deliberate way back to 3.
      - name: Check subsystem and resources
        run: |
          set -e
          objdump -p machpsdr.exe | grep -i subsystem
          objdump -p machpsdr.exe | grep -qi 'Subsystem.*00000002' \
            || { echo "not a GUI-subsystem build"; exit 1; }
          objdump -h machpsdr.exe | grep -q '\.rsrc' \
            || { echo "no .rsrc — the icon/VERSIONINFO resource is missing"; exit 1; }
          echo "subsystem GUI, resources present"

      # Packaged here and nowhere else: the gdk-pixbuf loader cache is built by
      # dlopen()ing each module, so only a native Windows run can produce a valid
      # one.  tools/win-package.sh deletes the cache rather than ship an empty
      # one, which is why a package made anywhere else is not a package.
      - name: Package
        run: make win-package

      - name: Check the package is complete
        run: |
          set -e
          d=machpsdr-win64
          for f in "$d/machpsdr.exe" "$d/libwdsp.dll" \
                   "$d/share/glib-2.0/schemas/gschemas.compiled" \
                   "$d/assets/cty.dat"; do
            [ -e "$f" ] || { echo "missing: $f"; exit 1; }
          done
          # The loader cache is the one piece that silently degrades: without it
          # the app starts and then cannot load its icon or save a decoded image.
          cache=$(find "$d/lib/gdk-pixbuf-2.0" -name loaders.cache)
          [ -n "$cache" ] || { echo "missing: loaders.cache"; exit 1; }
          grep -q '^"' "$cache" || { echo "loaders.cache lists no loaders"; exit 1; }
          echo "package OK: $(du -sh "$d" | cut -f1)"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: machpsdr-win64
          path: machpsdr-win64/
          if-no-files-found: error
          retention-days: 14

      # The release asset, from the same job that just ran the self-tests -- so
      # a package is attached only to a tag whose `make check` passed here.
      #
      # pwsh rather than the msys2 shell this job defaults to: `gh` is on the
      # runner's PATH, not inside MSYS2, and Compress-Archive is the zip this
      # image has.  The archive keeps the top-level machpsdr-win64/ folder, so
      # extracting it anywhere gives one directory rather than scattering a
      # hundred DLLs into Downloads.
      #
      # The body is left EMPTY on purpose: every release so far has carried its
      # notes in the annotated tag's own message, which GitHub renders when the
      # release has none of its own.  This job and the macOS one race to be
      # first, and being separate workflows neither can wait for the other, so
      # this is create-or-find: whichever arrives first makes the release, the
      # other uploads beside it.
      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          Compress-Archive -Path machpsdr-win64 -DestinationPath machpsdr-win64.zip -Force
          $found = $false
          for ($i = 1; $i -le 5; $i++) {
            gh release view $env:TAG *> $null
            if ($LASTEXITCODE -eq 0) { $found = $true; break }
            gh release create $env:TAG --verify-tag --title "" --notes ""
            if ($LASTEXITCODE -eq 0) { $found = $true; break }
            Start-Sleep -Seconds ($i * 5)
          }
          if (-not $found) { throw "release $env:TAG could not be created or found" }
          gh release upload $env:TAG machpsdr-win64.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw "uploading machpsdr-win64.zip failed" }
